<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danses louange hybride - Danse et prière</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root { --couleur: #1d5aa8; --fonce: #14306b; --texte: #2d2a26; --fond: #fffaf4; --doux: #5f574f; }
        body { font-family: Arial, sans-serif; background-color: var(--fond); color: var(--texte); margin: 0; padding: 20px; }
        h1 { text-align: center; color: var(--couleur); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border: 1px solid var(--couleur); }
        .card-img { flex: 0 0 110px; width: 110px; height: 110px; border-radius: 10px; object-fit: cover; background: #eee; }
        .card-img.vide { display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--couleur); background: #f6f1ea; }
        .card-texte { flex: 1; min-width: 0; }
        .card h3 { margin: 0 0 6px 0; color: var(--fonce); }
        .card .infos { margin: 0 0 6px 0; font-size: 0.9rem; color: var(--doux); }
        .card .invite { margin: 0; font-size: 0.85rem; color: var(--doux); }
        .loader { text-align: center; font-size: 1.2rem; margin-top: 50px; }
        .back-btn { display: block; width: max-content; margin: 20px auto; padding: 10px 20px; background: var(--couleur); color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } .card-img { flex-basis: 90px; width: 90px; height: 90px; } }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Retour au site principal</a>
    <h1>Listing des danses louange hybride</h1>

    <div id="loader" class="loader">Chargement des danses en cours...</div>
    <div id="danses-container" class="grid"></div>

    <script>
        // Dossier GitHub à lister (louange hybride)
        const DOSSIER = 'louanges';
        const API_URL = 'https://api.github.com/repos/Nico150981/danse-et-priere/contents/' + DOSSIER;
        const RAW_URL = 'https://raw.githubusercontent.com/Nico150981/danse-et-priere/main/' + DOSSIER + '/';

        // Échappe le texte venant des fichiers avant de l'afficher
        function echapper(texte) {
            const d = document.createElement('div');
            d.textContent = texte == null ? '' : String(texte);
            return d.innerHTML;
        }

        // Adresse de l'image : lien complet gardé tel quel, sinon chemin relatif au site
        function urlImage(chemin) {
            if (!chemin) return null;
            if (/^https?:\/\//.test(chemin)) return chemin;
            return chemin.replace(/^\//, '');
        }

        // Lit l'en-tête (entre les deux "---") d'un fichier .md
        function lireEntete(texte) {
            try {
                const parts = texte.split('---');
                return jsyaml.load(parts[1]) || {};
            } catch (e) {
                return {};
            }
        }

        fetch(API_URL)
            .then(response => response.json())
            .then(files => {
                const mdFiles = Array.isArray(files) ? files.filter(file => file.name.endsWith('.md')) : [];

                if (mdFiles.length === 0) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('danses-container').innerHTML = "<p>Aucune danse louange n'est disponible pour le moment.</p>";
                    return;
                }

                // On lit chaque fichier pour récupérer titre, infos et image
                return Promise.all(mdFiles.map(file =>
                    fetch(RAW_URL + file.name + '?t=' + new Date().getTime())
                        .then(r => r.ok ? r.text() : '')
                        .catch(() => '')
                        .then(texte => ({ name: file.name, data: lireEntete(texte) }))
                )).then(danses => {
                    document.getElementById('loader').style.display = 'none';
                    const container = document.getElementById('danses-container');

                    // Tri alphabétique sur le titre
                    danses.forEach(d => {
                        d.titre = d.data.title || d.name.replace('.md', '').replace(/-/g, ' ');
                    });
                    danses.sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));

                    danses.forEach(d => {
                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = 'danse.html?fichier=' + encodeURIComponent(d.name) + '&dossier=' + DOSSIER;

                        const infos = [];
                        if (d.data.choregraphe) infos.push('Chorégraphe : ' + d.data.choregraphe);
                        if (d.data.annee) infos.push('Année : ' + d.data.annee);
                        if (d.data.musique) infos.push('Compositeur : ' + d.data.musique);

                        const img = urlImage(d.data.image);
                        const imgHtml = img
                            ? '<img class="card-img" src="' + echapper(img) + '" alt="' + echapper(d.titre) + '" loading="lazy">'
                            : '<div class="card-img vide">♪</div>';

                        card.innerHTML =
                            imgHtml +
                            '<div class="card-texte">' +
                                '<h3>' + echapper(d.titre) + '</h3>' +
                                (infos.length ? '<p class="infos">' + echapper(infos.join(' | ')) + '</p>' : '') +
                                '<p class="invite">Cliquez pour voir les détails, les paroles et télécharger la fiche.</p>' +
                            '</div>';
                        container.appendChild(card);
                    });
                });
            })
            .catch(error => {
                document.getElementById('loader').innerText = "Erreur lors du chargement.";
                console.error('Erreur:', error);
            });
    </script>
</body>
</html>
